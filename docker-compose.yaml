name: dialogue-analyzer

services:
    web:
        build:
            context: .
            dockerfile: docker/frontend/Dockerfile
            target: web
        ports:
            - "8000:80"
        depends_on:
            - php
        restart: unless-stopped

    php:
        build:
            context: .
            dockerfile: docker/backend/Dockerfile
            target: app
        env_file: backend/.env
        depends_on:
            postgresql:
                condition: service_healthy
        restart: unless-stopped

    postgresql:
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-dialogue_analyzer}
            POSTGRES_USER: ${DB_USERNAME:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-dialogue_analyzer}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    pgdata:
