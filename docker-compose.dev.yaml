name: dialogue-analyzer-dev

services:
    vite:
        image: 'node:22-alpine'
        working_dir: /app
        volumes:
            - ./frontend:/app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"
        depends_on:
            - php

    php:
        build:
            context: .
            dockerfile: docker/backend/Dockerfile
            target: dev
        env_file: backend/.env
        working_dir: /var/www/html
        volumes:
            - ./backend:/var/www/html
        command: sh -c "composer install && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
        ports:
            - "8000:8000"
        depends_on:
            postgresql:
                condition: service_healthy

    postgresql:
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-dialogue_analyzer}
            POSTGRES_USER: ${DB_USERNAME:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgdata-dev:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-dialogue_analyzer}"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata-dev:
